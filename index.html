
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Estudos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="menu">
        <h2>Meu Painel 🌿</h2>

        <nav>
            <a href="#" class="ativo">Início</a>
            <a href="#">Minhas matérias</a>
            <a href="#">Minhas tarefas</a>
            <a href="#">Meu progresso</a>
        </nav>
    </aside>

    <main class="conteudo">

        <header>
            <h1>Olá! Vamos estudar? 💚</h1>
            <p>Organize suas tarefas e acompanhe sua evolução.</p>
        </header>

        <section class="resumo">

            <div class="cartao">
                <h3>Matérias</h3>
                <p>0</p>
            </div>

            <div class="cartao">
                <h3>Tarefas pendentes</h3>
                <p>0</p>
            </div>

            <div class="cartao">
                <h3>Tarefas concluídas</h3>
                <p>0</p>
            </div>

        </section>

        <section class="tarefas">
            <h2>Minhas atividades</h2>
            <p>Suas tarefas aparecerão aqui.</p>
        </section>

    </main>

</body>
</html>
